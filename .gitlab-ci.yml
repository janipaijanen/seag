stages:
  - validate
  - bundle
  - publication

default:
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git

validate:
  stage: validate
  script:
    - python -m unittest discover -s tests -v
    - git diff --check

release-candidate-bundle:
  stage: bundle
  needs: [validate]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - if [ -z "$CI_COMMIT_TAG" ]; then VERSION="0.0.0+git.${CI_COMMIT_SHORT_SHA}"; fi
    - python scripts/build-release-bundle.py --version "$VERSION" --commit "$CI_COMMIT_SHA" --output-dir dist --verify
    - mkdir reproducibility-check
    - python scripts/build-release-bundle.py --version "$VERSION" --commit "$CI_COMMIT_SHA" --output-dir reproducibility-check --verify
    - cmp "dist/seag-${VERSION}.tar.gz" "reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_REF_SLUG}-release-candidate"
    paths:
      - dist/
    expire_in: 30 days

stable-publication-gate:
  stage: publication
  needs: [release-candidate-bundle]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - python scripts/check-publication-gate.py
    - echo "Stable publication requires release-specific independent review evidence."
    - exit 1

