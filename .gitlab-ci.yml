# Feature and release branch pushes validate through their merge-request
# pipeline, avoiding the first-push/MR duplicate race. Main, tags, and
# deliberate non-push invocations always receive a pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "push"'
    - when: never

stages:
  - validate
  - bundle
  - publication

variables:
  GIT_DEPTH: "0"

default:
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git

validate:
  stage: validate
  script:
    - python scripts/check-spdx.py
    - python scripts/check-dco.py --revision "$CI_COMMIT_SHA"
    - python -m unittest discover -s tests -v
    - git diff --check

release-candidate-bundle:
  stage: bundle
  needs: [validate]
  script:
    - VERSION="$(tr -d '\n' < VERSION)"
    - if [ -n "$CI_COMMIT_TAG" ]; then python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --output-dir tag-candidate --verify; git fetch origin main; git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; fi
    - python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --output-dir dist --verify
    - mkdir reproducibility-check
    - python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --output-dir reproducibility-check --verify
    - cmp "dist/seag-${VERSION}.tar.gz" "reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_REF_SLUG}-release-candidate"
    paths:
      - dist/
    expire_in: 30 days

stable-publication-gate:
  stage: publication
  needs: [release-candidate-bundle]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - python scripts/check-publication-gate.py
    - python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --release-status stable --publication-gate asserted --output-dir release --verify
    - mkdir stable-reproducibility-check
    - python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --release-status stable --publication-gate asserted --output-dir stable-reproducibility-check --verify
    - VERSION="$(tr -d '\n' < VERSION)"
    - cmp "release/seag-${VERSION}.tar.gz" "stable-reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_TAG}-stable-release"
    paths:
      - release/

