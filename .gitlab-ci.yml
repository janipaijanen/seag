# Feature and release branch pushes validate through their merge-request
# pipeline, avoiding the first-push/MR duplicate race. Main, tags, and
# deliberate non-push invocations always receive a pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "push"'
    - when: never

stages:
  - validate
  - authorize
  - bundle
  - publication

variables:
  GIT_DEPTH: "0"
  UV_VERSION: "0.12.9"
  UV_NO_PROGRESS: "1"

default:
  # CPython 3.14.8 / Alpine 3.24 multi-architecture OCI index, pinned by digest.
  image: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script:
    - apk add --no-cache git=2.54.1-r0
    - python -m pip install --no-cache-dir "uv==$UV_VERSION"
    - python scripts/check-dependency-policy.py
    - uv lock --check
    - uv sync --locked --only-group conformance

validate:
  stage: validate
  script:
    - uv run --locked --no-sync reuse lint
    - uv run --locked --no-sync python scripts/check-spdx.py
    - uv run --locked --no-sync python scripts/check-dco.py --revision "$CI_COMMIT_SHA"
    - uv run --locked --no-sync python scripts/check-conformance.py
    - uv run --locked --no-sync check-jsonschema --check-metaschema schema/*.schema.json
    - uv run --locked --no-sync check-jsonschema --schemafile schema/source-0.1.schema.json fixtures/valid/manifest.json fixtures/valid/fragment.json fixtures/valid/variant.json
    - uv run --locked --no-sync python -m unittest discover -s tests -v
    - git diff --check

# Non-publishing proof for the reviewed CI toolchain recipe. The preparation
# job fetches only the URL/size/SHA-256 closure declared in inputs.json. The
# build job has no registry authentication, scrubs the CI environment before
# starting rootless BuildKit, exports an OCI archive, and never pushes it.
toolchain-context-proof:
  stage: validate
  image:
    name: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "ci/toolchain-build-proof"'
  script:
    - python scripts/prepare-toolchain-context.py
  artifacts:
    name: "seag-toolchain-inputs-${CI_COMMIT_SHA}"
    paths:
      - ci/toolchain/downloads/
    expire_in: 7 days

toolchain-build-proof:
  stage: validate
  image:
    name: moby/buildkit@sha256:7d02292556e66feea6d2d89b7ec143503b57e4f59a4efc6b7ece8547e4d3e5be
    entrypoint: [""]
  before_script: []
  needs:
    - job: toolchain-context-proof
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "ci/toolchain-build-proof"'
  script:
    - test -z "${DOCKER_AUTH_CONFIG:-}"
    - test ! -e "$HOME/.docker/config.json"
    - for path in ci/toolchain/downloads/*; do wc -c "$path"; done
    - sha256sum ci/toolchain/downloads/*
    - mkdir -p toolchain-proof
    - >-
      env -i
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HOME=/home/user
      USER=user
      XDG_RUNTIME_DIR=/run/user/1000
      TMPDIR=/home/user/.local/tmp
      BUILDKIT_HOST=unix:///run/user/1000/buildkit/buildkitd.sock
      BUILDKITD_FLAGS=--oci-worker-no-process-sandbox
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR/ci/toolchain"
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --output type=oci,dest="$CI_PROJECT_DIR/toolchain-proof/seag-ci-toolchain.oci.tar"
      --metadata-file "$CI_PROJECT_DIR/toolchain-proof/build-metadata.json"
    - sha256sum toolchain-proof/seag-ci-toolchain.oci.tar | tee toolchain-proof/SHA256SUMS
    - tar -tf toolchain-proof/seag-ci-toolchain.oci.tar > toolchain-proof/oci-members.txt
    - grep -Fx oci-layout toolchain-proof/oci-members.txt
    - grep -Fx index.json toolchain-proof/oci-members.txt
  artifacts:
    name: "seag-toolchain-proof-${CI_COMMIT_SHA}"
    paths:
      - toolchain-proof/
    expire_in: 7 days

tag-authorization:
  stage: authorize
  needs: [validate]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - uv run --locked --no-sync python scripts/check-tag-containment.py --commit "$CI_COMMIT_SHA" --remote origin --branch "$CI_DEFAULT_BRANCH" --server-host "$CI_SERVER_HOST" --project-path "$CI_PROJECT_PATH"

release-candidate-bundle:
  stage: bundle
  needs:
    - validate
    - job: tag-authorization
      optional: true
  script:
    - VERSION="$(tr -d '\n' < VERSION)"
    - if [ -n "$CI_COMMIT_TAG" ]; then uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --output-dir tag-candidate --verify; fi
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --output-dir dist --verify
    - mkdir reproducibility-check
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --output-dir reproducibility-check --verify
    - cmp "dist/seag-${VERSION}.tar.gz" "reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_REF_SLUG}-release-candidate"
    paths:
      - dist/
    expire_in: 30 days

stable-publication-gate:
  stage: publication
  needs: [release-candidate-bundle]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - uv run --locked --no-sync python scripts/check-publication-gate.py
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --release-status stable --publication-gate asserted --output-dir release --verify
    - mkdir stable-reproducibility-check
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --release-status stable --publication-gate asserted --output-dir stable-reproducibility-check --verify
    - VERSION="$(tr -d '\n' < VERSION)"
    - cmp "release/seag-${VERSION}.tar.gz" "stable-reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_TAG}-stable-release"
    paths:
      - release/

