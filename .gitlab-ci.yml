# Feature and release branch pushes validate through their merge-request
# pipeline, avoiding the first-push/MR duplicate race. Main, tags, and
# deliberate non-push invocations always receive a pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "push"'
    - when: never

stages:
  - validate
  - authorize
  - bundle
  - publication

variables:
  GIT_DEPTH: "0"
  UV_VERSION: "0.12.9"
  UV_NO_PROGRESS: "1"

default:
  # CPython 3.14.8 / Alpine 3.24 multi-architecture OCI index, pinned by digest.
  image: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script:
    - apk add --no-cache git=2.54.1-r0
    - python -m pip install --no-cache-dir "uv==$UV_VERSION"
    - python scripts/check-dependency-policy.py
    - uv lock --check
    - uv sync --locked --only-group conformance

validate:
  stage: validate
  script:
    - uv run --locked --no-sync reuse lint
    - uv run --locked --no-sync python scripts/check-spdx.py
    - uv run --locked --no-sync python scripts/check-dco.py --revision "$CI_COMMIT_SHA"
    - uv run --locked --no-sync python scripts/check-conformance.py
    - uv run --locked --no-sync check-jsonschema --check-metaschema schema/*.schema.json
    - uv run --locked --no-sync check-jsonschema --schemafile schema/source-0.1.schema.json fixtures/valid/manifest.json fixtures/valid/fragment.json fixtures/valid/variant.json
    - uv run --locked --no-sync python -m unittest discover -s tests -v
    - git diff --check

# Non-publishing proof for the reviewed CI toolchain recipe. The preparation
# job fetches only the URL/size/SHA-256 closure declared in inputs.json. The
# build job has no registry authentication, scrubs the CI environment before
# starting rootless BuildKit, exports an OCI archive, and never pushes it.
toolchain-context-proof:
  stage: validate
  image:
    name: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^ci\/toolchain-(build-proof|boundary-followup|publisher)$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - test "$(cat ci/toolchain/SOURCE_DATE_EPOCH)" = "1795432630"
    - python scripts/prepare-toolchain-context.py
    - chmod 0444 ci/toolchain/downloads/*
  artifacts:
    name: "seag-toolchain-inputs-${CI_COMMIT_SHA}"
    paths:
      - ci/toolchain/downloads/
    expire_in: 7 days

.toolchain-build-proof:
  stage: validate
  image:
    name: moby/buildkit@sha256:7d02292556e66feea6d2d89b7ec143503b57e4f59a4efc6b7ece8547e4d3e5be
    entrypoint: [""]
  before_script: []
  needs:
    - job: toolchain-context-proof
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^ci\/toolchain-(build-proof|boundary-followup|publisher)$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - test -z "${DOCKER_AUTH_CONFIG:-}"
    - test ! -e "$HOME/.docker/config.json"
    - for path in ci/toolchain/downloads/*; do wc -c "$path"; done
    - sha256sum ci/toolchain/downloads/*
    - test "$PROOF_SLOT" = a -o "$PROOF_SLOT" = b
    - proof_dir="$CI_PROJECT_DIR/toolchain-proof-$PROOF_SLOT"
    - mkdir -p "$proof_dir"
    - context_dir="$CI_PROJECT_DIR/toolchain-build-context"
    - mkdir -p "$context_dir/ci/toolchain/downloads"
    - test -f ci/toolchain/inputs.json -a ! -L ci/toolchain/inputs.json
    - test -f ci/toolchain/install.py -a ! -L ci/toolchain/install.py
    - cp ci/toolchain/inputs.json ci/toolchain/install.py "$context_dir/ci/toolchain/"
    - for path in ci/toolchain/downloads/*; do test -f "$path" -a ! -L "$path" || exit 1; cp "$path" "$context_dir/ci/toolchain/downloads/" || exit 1; done
    - chmod -R a-w "$context_dir"
    - test -z "$(find "$context_dir" ! -type d ! -type f -print -quit)"
    - test ! -e "$context_dir/.git"
    - >-
      env -i
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HOME=/home/user
      USER=user
      XDG_RUNTIME_DIR=/run/user/1000
      TMPDIR=/home/user/.local/tmp
      BUILDKIT_HOST=unix:///run/user/1000/buildkit/buildkitd.sock
      BUILDKITD_FLAGS=--oci-worker-no-process-sandbox
      SOURCE_DATE_EPOCH="$(cat ci/toolchain/SOURCE_DATE_EPOCH)"
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$context_dir"
      --local dockerfile="$CI_PROJECT_DIR/ci/toolchain"
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --output type=oci,dest="$proof_dir/seag-ci-toolchain.oci.tar",rewrite-timestamp=true,compatibility-version=30
      --metadata-file "$proof_dir/build-metadata.json"
    - (cd "$proof_dir" && sha256sum seag-ci-toolchain.oci.tar | tee SHA256SUMS)
    - tar -tf "$proof_dir/seag-ci-toolchain.oci.tar" > "$proof_dir/oci-members.txt"
    - grep -Fx oci-layout "$proof_dir/oci-members.txt"
    - grep -Fx index.json "$proof_dir/oci-members.txt"
  artifacts:
    name: "seag-toolchain-proof-${PROOF_SLOT}-${CI_COMMIT_SHA}"
    paths:
      - "toolchain-proof-${PROOF_SLOT}/"
    expire_in: 7 days

toolchain-build-proof-a:
  extends: .toolchain-build-proof
  variables:
    PROOF_SLOT: "a"

toolchain-build-proof-b:
  extends: .toolchain-build-proof
  variables:
    PROOF_SLOT: "b"

toolchain-reproducibility-proof:
  stage: validate
  image:
    name: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script: []
  needs:
    - job: toolchain-build-proof-a
      artifacts: true
    - job: toolchain-build-proof-b
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^ci\/toolchain-(build-proof|boundary-followup|publisher)$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - (cd toolchain-proof-a && sha256sum -c SHA256SUMS)
    - (cd toolchain-proof-b && sha256sum -c SHA256SUMS)
    - cmp toolchain-proof-a/seag-ci-toolchain.oci.tar toolchain-proof-b/seag-ci-toolchain.oci.tar
    - cmp toolchain-proof-a/build-metadata.json toolchain-proof-b/build-metadata.json
    - cmp toolchain-proof-a/oci-members.txt toolchain-proof-b/oci-members.txt
    - mkdir toolchain-proof
    - cp toolchain-proof-a/seag-ci-toolchain.oci.tar toolchain-proof/
    - cp toolchain-proof-a/build-metadata.json toolchain-proof/
    - cp toolchain-proof-a/oci-members.txt toolchain-proof/
    - cp toolchain-proof-a/SHA256SUMS toolchain-proof/
  artifacts:
    name: "seag-toolchain-reproducible-${CI_COMMIT_SHA}"
    paths:
      - toolchain-proof/
    expire_in: 7 days

toolchain-publish-admission:
  stage: authorize
  image:
    name: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script: []
  needs:
    - job: validate
      artifacts: false
    - job: toolchain-reproducibility-proof
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - python scripts/check-toolchain-publish-admission.py --proof-dir toolchain-proof --output-dir toolchain-publish-admission
  artifacts:
    name: "seag-toolchain-publish-admission-${CI_COMMIT_SHA}"
    paths:
      - toolchain-publish-admission/
    expire_in: never

tag-authorization:
  stage: authorize
  needs: [validate]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - uv run --locked --no-sync python scripts/check-tag-containment.py --commit "$CI_COMMIT_SHA" --remote origin --branch "$CI_DEFAULT_BRANCH" --server-host "$CI_SERVER_HOST" --project-path "$CI_PROJECT_PATH"

release-candidate-bundle:
  stage: bundle
  needs:
    - validate
    - job: tag-authorization
      optional: true
  script:
    - VERSION="$(tr -d '\n' < VERSION)"
    - if [ -n "$CI_COMMIT_TAG" ]; then uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --output-dir tag-candidate --verify; fi
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --output-dir dist --verify
    - mkdir reproducibility-check
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --output-dir reproducibility-check --verify
    - cmp "dist/seag-${VERSION}.tar.gz" "reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_REF_SLUG}-release-candidate"
    paths:
      - dist/
    expire_in: 30 days

stable-publication-gate:
  stage: publication
  needs: [release-candidate-bundle]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - uv run --locked --no-sync python scripts/check-publication-gate.py
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --release-status stable --publication-gate asserted --output-dir release --verify
    - mkdir stable-reproducibility-check
    - uv run --locked --no-sync python scripts/build-release-bundle.py --commit "$CI_COMMIT_SHA" --check-tag "$CI_COMMIT_TAG" --release-status stable --publication-gate asserted --output-dir stable-reproducibility-check --verify
    - VERSION="$(tr -d '\n' < VERSION)"
    - cmp "release/seag-${VERSION}.tar.gz" "stable-reproducibility-check/seag-${VERSION}.tar.gz"
  artifacts:
    name: "seag-${CI_COMMIT_TAG}-stable-release"
    paths:
      - release/

toolchain-publish-candidate:
  stage: publication
  image:
    name: quay.io/skopeo/stable@sha256:83679426be479f119a92fed78fb441f046ea07ea5e5a4b3a838f7b155be567fe
    entrypoint: [""]
  before_script: []
  needs:
    - job: toolchain-reproducibility-proof
      artifacts: true
    - job: toolchain-publish-admission
      artifacts: true
  resource_group: seag-toolchain-publisher
  environment:
    name: seag-toolchain-candidate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - scripts/publish-toolchain-candidate.sh
  artifacts:
    name: "seag-toolchain-publication-${CI_COMMIT_SHA}"
    paths:
      - toolchain-publication/
    expire_in: never

